version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: studentms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studentms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studentms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - studentms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studentms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-studentms}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - studentms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studentms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - studentms_network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  studentms_network:
    driver: bridge
